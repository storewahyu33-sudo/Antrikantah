<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrean Self-Service</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f7f7f7; }
        .card { background: #fff; border: 1px solid #ccc; padding: 25px; border-radius: 12px; max-width: 350px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .ticket { display: none; background: #e0f7fa; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: center; }
        .ticket-number { font-size: 42px; font-weight: normal; color: #00796b; margin: 10px 0; text-align: center; }
        button { padding: 10px 20px; background: #00796b; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-top: 10px; }
        button:hover { background: #004d40; }
        .btn-download { background: #0288d1; }
        .btn-download:hover { background: #01579b; }
        input, select { width: 90%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        label { font-size: 14px; display: block; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card" id="formCard">
    <h2>Formulir Antrean</h2>
    <form id="queueForm">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" required placeholder="Masukkan nama Anda">
        
        <label for="no_hp">No. HP / WhatsApp:</label>
        <input type="tel" id="no_hp" required placeholder="Contoh: 081234567890">

        <label for="layanan">Pilih Kebutuhan Pelayanan:</label>
        <select id="layanan">
            <option value="A">Konsultasi</option>
            <option value="B">Permohonan Pelayanan (A)</option>
            <option value="C">Permohonan Pelayanan (B)</option>
            <option value="D">Permohonan Pelayanan (C)</option>
        </select><br>

        <button type="button" onclick="generateTicket()">Ambil Nomor Antrian</button>
    </form>

    <!-- Hasil Tiket Digital -->
    <div id="ticketResult" class="ticket">
        <div style="font-style: italic; font-size: 16px; margin-bottom: 5px; text-align: center;">KANTOR PERTANAHAN KABUPATEN MUNA</div>
        <h3 style="text-align: center; font-weight: normal;">Nomor Antrean Anda</h3>
        <div class="ticket-number" id="displayNum">-</div>
        <p id="displayService" style="margin: 5px 0; text-align: center;"></p>
        <p id="displayNama" style="font-size: 14px; margin: 3px 0; color: #333; text-align: center;"></p>
        <p id="displayHp" style="font-size: 14px; margin: 3px 0; color: #333; text-align: center;"></p>
        <p id="displayTime" style="font-size: 12px; color: #555; margin-top: 10px; text-align: center;"></p>
        <small style="color: #666; display: block; text-align: center;">Silahkan tunggu nomor anda dipanggil</small><br>
        
        <!-- Tombol untuk mengunduh / cetak tiket -->
        <button class="btn-download" onclick="unduhTiket()">Simpan / Cetak Tiket</button>
    </div>
</div>

<script>
    // --- FITUR RESET OTOMATIS BERDASARKAN TANGGAL HARI INI ---
    const tanggalHariIni = new Date().toISOString().slice(0, 10); // Format: YYYY-MM-DD
    const tanggalTersimpan = localStorage.getItem('queueDate');

    if (tanggalTersimpan !== tanggalHariIni) {
        localStorage.setItem('queueDate', tanggalHariIni);
        localStorage.setItem('countA', 0);
        localStorage.setItem('countB', 0);
        localStorage.setItem('countC', 0);
        localStorage.setItem('countD', 0);
    }

    let lastNumberA = parseInt(localStorage.getItem('countA')) || 0;
    let lastNumberB = parseInt(localStorage.getItem('countB')) || 0;
    let lastNumberC = parseInt(localStorage.getItem('countC')) || 0;
    let lastNumberD = parseInt(localStorage.getItem('countD')) || 0;

    function generateTicket() {
        const nama = document.getElementById('nama').value;
        const noHp = document.getElementById('no_hp').value;
        const layanan = document.getElementById('layanan').value;

        if (!nama || !noHp) {
            alert("Harap isi Nama dan No. HP terlebih dahulu.");
            return;
        }

        let numFormatted = "";
        let namaLayanan = "";

        if (layanan === 'A') {
            lastNumberA++;
            localStorage.setItem('countA', lastNumberA);
            numFormatted = "A" + String(lastNumberA).padStart(3, '0');
            namaLayanan = "Konsultasi";
        } else if (layanan === 'B') {
            lastNumberB++;
            localStorage.setItem('countB', lastNumberB);
            numFormatted = "B" + String(lastNumberB).padStart(3, '0');
            namaLayanan = "Permohonan Pelayanan (A)";
        } else if (layanan === 'C') {
            lastNumberC++;
            localStorage.setItem('countC', lastNumberC);
            numFormatted = "C" + String(lastNumberC).padStart(3, '0');
            namaLayanan = "Permohonan Pelayanan (B)";
        } else if (layanan === 'D') {
            lastNumberD++;
            localStorage.setItem('countD', lastNumberD);
            numFormatted = "D" + String(lastNumberD).padStart(3, '0');
            namaLayanan = "Permohonan Pelayanan (C)";
        }

        const sekarang = new Date();
        const opsiWaktu = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        const formatWaktuString = sekarang.toLocaleDateString('id-ID', opsiWaktu).replace(' pukul', '');

        document.getElementById('displayNum').innerText = numFormatted;
        document.getElementById('displayService').innerText = "Layanan: " + namaLayanan;
        document.getElementById('displayNama').innerText = "Nama: " + nama;
        document.getElementById('displayHp').innerText = "No. HP: " + noHp;
        document.getElementById('displayTime').innerText = formatWaktuString;
        
        document.getElementById('ticketResult').style.display = "block";
        document.getElementById('queueForm').style.display = "none";
    }

    function unduhTiket() {
        window.print();
    }
</script>

</body>
</html>
